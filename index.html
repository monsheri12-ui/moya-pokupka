<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214c47">
  <meta name="description" content="Послушай продавца по-монгольски, узнай свой заказ и забери покупки.">
  <title>Моя покупка · Монгольский на слух</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="menu.css">
  <script src="config.js" defer></script>
  <script src="content.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="is-loading">
  <section id="loading-screen" class="loading-screen" aria-labelledby="loading-title" aria-busy="true">
    <div class="loading-card">
      <div class="loading-emblem" aria-hidden="true">₮</div>
      <p class="loading-eyebrow">Монгольский магазин</p>
      <h1 id="loading-title">Моя покупка</h1>
      <p id="loading-status" role="status">Открываем магазин…</p>
      <progress id="loading-progress" max="100" value="0" aria-label="Загрузка игры"></progress>
      <span id="loading-percent" aria-hidden="true">0%</span>
      <button id="loading-retry" class="primary" data-action="boot-retry" hidden>Повторить загрузку</button>
    </div>
  </section>
  <div class="game-shell" inert>
    <aside class="shop-scene" aria-label="Продавец за прилавком уютного магазина в Улан-Баторе">
      <div class="speaking-light" aria-hidden="true"></div>
    </aside>
      <header class="game-hud">
        <a class="wordmark" href="#home" id="home-link">Моя покупка<span>Монгольский магазин</span></a>
        <nav aria-label="Меню игры">
          <button class="icon-button" id="history-button" aria-label="Покупки и разбор ошибок" title="Покупки и ошибки"></button>
          <button class="icon-button" id="settings-button" aria-label="Настройки" title="Настройки"></button>
          <button class="icon-button" id="help-button" aria-label="Как играть" title="Как играть"></button>
          <button class="icon-button" id="fullscreen-button" aria-label="На весь экран" title="На весь экран"></button>
        </nav>
      </header>
      <div id="progress" class="sr-only"></div>
      <div class="counter-surface" aria-hidden="true"></div>
      <main id="game" tabindex="-1"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>Для игры нужно включить JavaScript в браузере.</noscript>
</body>
</html>
